POM_DEVELOPER_ID=berkayturanci
POM_DEVELOPER_NAME=Berkay Turancı
android.useAndroidX=true
android.enableJetifier=true

# AGP 9 transitional opt-outs. Both are removed in AGP 10, so drop them before that upgrade.
# - builtInKotlin=false keeps the org.jetbrains.kotlin.android plugin and its kotlinOptions DSL.
#   Built-in Kotlin also moves compiled classes out of build/tmp/kotlin-classes/<variant>,
#   which the JaCoCo report and coverage verification tasks read from.
# - newDsl=false is required alongside it: org.jetbrains.kotlin.android cannot be applied under
#   AGP 9's new DSL, and the build fails at plugin application without this flag.
android.builtInKotlin=false
android.newDsl=false
