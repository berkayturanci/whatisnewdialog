name: PR Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-lint:
    # Dependabot writes its own PR bodies, which carry no "Closes #N" / "no issue" line.
    # Key off the PR author, not github.actor: actor becomes whoever last pushed to the
    # branch (e.g. an "Update branch" click), which would re-enable the lint on these PRs.
    # A job skipped by `if:` reports success, so the required `pr-lint` check is still satisfied.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR Body Content
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const issueRegex = /(Closes #\d+|no issue)/i;
            
            if (!issueRegex.test(body)) {
              core.setFailed("PR body must include a 'Related issues' section with 'Closes #N' or 'no issue'.");
            }
            
            if (body.length < 20) {
              core.setFailed("PR body must contain a meaningful summary.");
            }
